apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-backend
  namespace: travelo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travelo-backend
  template:
    metadata:
      labels:
        app: travelo-backend
    spec:
      containers:
        - name: backend
          image: shymoondocker/travelo-backend:2.0.2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          
---
apiVersion: v1
kind: Service
metadata:
  name: travelo-backend
  namespace: travelo
spec:
  selector:
    app: travelo-backend
  ports:
    - port: 8080
      targetPort: 8080